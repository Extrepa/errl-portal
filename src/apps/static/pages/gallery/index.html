<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Art Gallery | Errl Portal</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../../../../shared/styles/errlDesignSystem.css" />
  <link rel="stylesheet" href="../../../../shared/styles/errlStaticPage.css" />
  <link rel="stylesheet" href="../../../../shared/styles/errlPortalHeader.css" />
</head>
<body class="errl-static-page errl-gallery-page">
  <header class="errl-header">
    <div class="errl-header-content">
      <a class="errl-home-btn" href="/">
        <span class="chevron">◀</span>
        <span>Back to Portal</span>
      </a>
      <nav class="errl-nav" aria-label="Portal sections">
        <a class="errl-bubble-btn" href="https://forum.errl.wtf">Forum</a>
        <a class="errl-bubble-btn" href="/about/" data-portal-link="about/">About</a>
        <a class="errl-bubble-btn active" href="/gallery/" data-portal-link="gallery/" aria-current="page">Gallery</a>
        <a class="errl-bubble-btn" href="/studio/" data-portal-link="studio/">Studio</a>
      </nav>
    </div>
  </header>
  <main class="errl-static-main errl-gallery-main">
    <h1 class="errl-gallery-title">Floating Hall</h1>
    <p class="errl-gallery-sub">Curated renders &amp; photography — scroll to drift through the room.</p>
    <div id="gallery-root"></div>
  </main>

  <script type="module">
    const env = (import.meta && import.meta.env) ? import.meta.env : {};
    const baseUrl = typeof env.BASE_URL === "string" ? env.BASE_URL : "/";
    function resolvePortalUrl(pagePath) {
      let clean = pagePath.replace(/^pages\//, '');
      clean = clean.replace(/^\//, '');
      clean = clean.replace(/\/$/, '');
      clean = clean.replace(/\/index\.html$/, '');
      clean = clean.replace(/index\.html$/, '');
      return clean ? `/${clean}/` : '/';
    }

    document.querySelectorAll("[data-portal-link]").forEach((el) => {
      const target = el.getAttribute("data-portal-link");
      if (target) el.setAttribute("href", resolvePortalUrl(target));
    });
  </script>
  <script type="module" src="../../../../shared/scripts/portal-nav-visibility.mjs"></script>
  <script type="module" src="./main.tsx"></script>
</body>
</html>
